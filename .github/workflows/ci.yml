name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Public API report is up to date
        run: pnpm api:check
      - name: Bundle size budgets (min+gzip, see .size-limit.json)
        run: pnpm size
      - name: API reference builds without warnings (TypeDoc)
        run: pnpm docs:api --treatWarningsAsErrors

  packages:
    name: packages (publint, attw, install smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `changeset status` compares with main
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Pack and check with publint and attw
        run: pnpm check:packages
      - name: Install the tarballs in Node ESM/CJS, React SSR, Vite and Next.js projects
        run: pnpm smoke
      - name: VERSION constants match package.json
        run: node scripts/sync-versions.mjs --check
      - name: Pending changesets are valid
        run: pnpm exec changeset status

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
