name: Nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      args:
        description: Extra Playwright arguments for the e2e jobs (e.g. --project=webkit --grep=selection)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  perf:
    name: Runtime perf budgets (Chromium, CDP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:perf

  browsers:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PW_ALL_BROWSERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run e2e
        shell: bash
        env:
          E2E_ARGS: ${{ inputs.args }}
        # Unquoted on purpose: the input is a list of arguments.
        run: pnpm e2e $E2E_ARGS
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
